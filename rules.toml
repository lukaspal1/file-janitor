# File Janitor — sorting rules.
#
# Rules are evaluated top to bottom (by `priority`, lower first).
# The FIRST rule whose criteria all match wins.
#
# Fields:
#   name             — human label, shown in the UI
#   priority         — lower runs first (default 100 + index)
#   destination      — where to move the file. Omit for "leave in place".
#   action           — "move" | "trash" | "skip"
#   extensions       — list of extensions (with or without leading dot)
#   name_regex       — Python regex, matched against the filename
#   path_regex       — Python regex, matched against the full path
#   min_size/max_size — bytes
#   exclude_path_regex — if the path matches this, the rule is skipped
#   skip_if_project  — leave the file alone if it's inside a code project
#   skip_if_cloud    — never touch online-only / placeholder files (default true)
#   preserve_folders — keep the file's subfolder under destination
#                      (default: preserve_folders in config.toml)
#   enabled          — toggle a rule off without deleting it


# ---------- Desktop cleanup (runs first, highest priority) ----------

[[rules]]
name = "Desktop shortcuts -> Shortcuts"
priority = 10
action = "move"
destination = "~/Desktop/_Shortcuts"
extensions = [".lnk", ".url", ".website"]
preserve_folders = false
description = "Windows .lnk shortcuts and internet shortcuts off the desktop."

[[rules]]
name = "Desktop game folders (leave alone)"
priority = 5
action = "skip"
path_regex = "(?i)[\\\\/]Desktop[\\\\/][^\\\\/]*([Gg]ame|[Ss]team|[Ee]pic|[Rr]iot|[Bb]attle)[^\\\\/]*$"
description = "Flag desktop game folders, but never move them."


# ---------- Videos ----------

[[rules]]
name = "Videos -> Videos/Sorted"
priority = 100
action = "move"
destination = "~/Videos/Sorted"
extensions = [".mp4", ".mkv", ".avi", ".mov", ".wmv", ".flv", ".webm", ".m4v", ".mpg", ".mpeg", ".3gp"]
exclude_path_regex = "(?i)[\\\\/](Videos|Movies)[\\\\/]"
description = "Loose video files outside the standard Videos folder."


# ---------- Pictures ----------

[[rules]]
name = "Screenshots"
priority = 110
action = "move"
destination = "~/Pictures/Screenshots"
extensions = [".png", ".jpg", ".jpeg"]
name_regex = "(?i)screenshot|screen[ _-]?shot|capture"
description = "Filename looks like a screenshot."

[[rules]]
name = "Pictures -> Pictures/Sorted"
priority = 120
action = "move"
destination = "~/Pictures/Sorted"
extensions = [".jpg", ".jpeg", ".png", ".gif", ".bmp", ".tiff", ".tif", ".webp", ".heic", ".raw", ".cr2", ".nef"]
exclude_path_regex = "(?i)[\\\\/](Pictures|Photos|Images)[\\\\/]"
description = "Loose image files outside the standard Pictures folder."


# ---------- Audio ----------

[[rules]]
name = "Audio -> Music/Sorted"
priority = 130
action = "move"
destination = "~/Music/Sorted"
extensions = [".mp3", ".wav", ".flac", ".aac", ".ogg", ".m4a", ".wma", ".opus"]
exclude_path_regex = "(?i)[\\\\/](Music|Audio)[\\\\/]"


# ---------- Documents ----------

[[rules]]
name = "Invoices and receipts"
priority = 140
action = "move"
destination = "~/Documents/Finance"
extensions = [".pdf", ".png", ".jpg", ".jpeg"]
name_regex = "(?i)invoice|receipt|bill"
description = "Filename looks like a financial document."

[[rules]]
name = "School work"
priority = 150
action = "move"
destination = "~/Documents/School"
extensions = [".pdf", ".doc", ".docx", ".ppt", ".pptx", ".txt", ".md", ".odt"]
name_regex = "(?i)hw[ _-]?\\d|homework|assignment|lecture|notes|syllabus|exam"

[[rules]]
name = "Documents -> Documents/Sorted"
priority = 160
action = "move"
destination = "~/Documents/Sorted"
extensions = [".pdf", ".doc", ".docx", ".rtf", ".odt", ".txt", ".md", ".tex"]
exclude_path_regex = "(?i)[\\\\/](Documents|Docs)[\\\\/]"


# ---------- Spreadsheets / Presentations ----------

[[rules]]
name = "Spreadsheets"
priority = 170
action = "move"
destination = "~/Documents/Spreadsheets"
extensions = [".xls", ".xlsx", ".csv", ".ods", ".tsv"]

[[rules]]
name = "Presentations"
priority = 175
action = "move"
destination = "~/Documents/Presentations"
extensions = [".ppt", ".pptx", ".odp", ".key"]


# ---------- Archives / installers ----------

[[rules]]
name = "Installers"
priority = 180
action = "move"
destination = "~/Downloads/_Installers"
extensions = [".exe", ".msi", ".dmg", ".pkg", ".deb", ".rpm", ".appimage"]

[[rules]]
name = "Archives"
priority = 185
action = "move"
destination = "~/Downloads/_Archives"
extensions = [".zip", ".rar", ".7z", ".tar", ".gz", ".bz2", ".xz", ".iso"]


# ---------- Code ----------
# IMPORTANT: skip_if_project = true means any code file inside a folder
# that has a project marker (.git, package.json, pyproject.toml, etc.)
# is left alone. Only standalone code files get collected.

[[rules]]
name = "Standalone code files"
priority = 200
action = "move"
destination = "~/Documents/Code"
extensions = [
  ".py", ".js", ".ts", ".jsx", ".tsx", ".java", ".c", ".cpp", ".h", ".hpp",
  ".cs", ".go", ".rs", ".rb", ".php", ".swift", ".kt", ".scala", ".sh",
  ".bash", ".zsh", ".ps1", ".bat", ".html", ".css", ".scss", ".sass",
  ".sql", ".r", ".m", ".lua", ".pl", ".ex", ".exs", ".clj", ".hs",
  ".vue", ".svelte", ".dart", ".zig", ".nim", ".jl",
]
skip_if_project = true
exclude_path_regex = "(?i)[\\\\/](Code|Projects|Repos|src|dev)[\\\\/]"
description = "Standalone code files not part of a project."